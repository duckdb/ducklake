services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: seaweedfs
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - TZ=UTC   # Force UTC timezone
    networks:
      - s3_net
    ports:
      - "9000:9000"  # S3 API
    command: ["server", "-dir=/data", "-ip=seaweedfs", "-s3", "-s3.port=9000"]

  s3-init:
    depends_on:
      - seaweedfs
    image: amazon/aws-cli:2.36.44
    networks:
      - s3_net
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://seaweedfs:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $(seq 60); do
          aws s3 ls s3://mybucket > /dev/null 2>&1 || aws s3 mb s3://mybucket
          aws s3 cp /etc/hostname s3://mybucket/.ready && aws s3 rm s3://mybucket/.ready && exit 0
          echo 'Waiting for SeaweedFS...'
          sleep 2
        done
        exit 1

networks:
  s3_net:
